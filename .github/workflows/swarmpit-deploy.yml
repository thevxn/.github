name: Swarmpit Deploy Pipeline

on:
    workflow_call:
        inputs:
            project_name:
                description: "Project name in Swarmpit"
                required: true
                type: string
        secrets:
            SWARMPIT_BEARER:
                required: true
            SWARMPIT_BASE_URL:
                required: true

jobs:
    deploy:
        runs-on: [builder]
        steps:
            - uses: actions/checkout@v4
            - name: Deploy using Swarmpit
              run: |
                RESPONSE=$(curl -X POST -sSL -w "\n%{http_code}" \
                  -H "authorization: ${{ secrets.SWARMPIT_BEARER }}" \
                  "${{ secrets.SWARMPIT_BASE_URL }}/services/${{ inputs.project_name }}/redeploy")
                
                HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
                BODY=$(echo "$RESPONSE" | head -n -1)
                
                echo "Response: $BODY"
                echo "HTTP status: $HTTP_CODE"
                
                if [[ "$HTTP_CODE" -lt 200 || "$HTTP_CODE" -ge 300 ]]; then
                  echo "Deploy failed with status $HTTP_CODE"
                  exit 1
                fi
